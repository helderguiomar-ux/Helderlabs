name: HELDERLABS CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    name: Lint, Typecheck, Multi-Tenant AST Check & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: helderlabs_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: cd backend && npm ci

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate

      - name: Run Database Migrations
        run: cd backend && npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/helderlabs_erp_test?schema=public"

      - name: Seed Database for Integration Tests
        run: cd backend && npx tsx prisma/seed.ts
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/helderlabs_erp_test?schema=public"
          NODE_ENV: "development"

      - name: ESLint Check
        run: cd backend && npm run lint

      - name: TypeScript Typecheck
        run: cd backend && npm run typecheck

      - name: Execute Full Test Suite & AST Isolation Checks
        run: cd backend && npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/helderlabs_erp_test?schema=public"
          JWT_SECRET: "test_jwt_secret_key_helderlabs_min_64_chars_for_security_checks"
          ALLOW_DEV_OTP: "true"
